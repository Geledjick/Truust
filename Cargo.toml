[package]
name = "truust"
version = "0.1.2"
edition = "2024"
description = "A tree alternative with a pipeline CLI"
license = "MIT"
repository = "https://github.com/Geledjick/Truust"
readme = "README.md"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
globset = "0.4"
mimalloc = { version = "0.1", default-features = false }