[package]
name = "truust"
version = "0.1.0"
edition = "2024"
description = "A tree alternative with a pipeline CLI"
license = "MIT"
repository = "https://github.com/Geledjick/Truust"
readme = "README.md"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
globset = "0.4"